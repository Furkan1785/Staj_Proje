services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sakaryaerp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-sakaryaerp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sadece localhost'a bağlanır (0.0.0.0 değil) — web container'ı zaten Docker'ın
    # dahili ağı üzerinden "db" host adıyla erişiyor, bu mapping sadece host makinedeki
    # araçlar (dotnet watch run, psql, pgAdmin) içindir. Aynı compose dosyası VPS'te de
    # kullanıldığından, 0.0.0.0:5432 açık bırakmak güvenlik listesi/iptables'taki tek bir
    # yapılandırma hatasında Postgres'i doğrudan internete açardı.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakaryaerp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./SakaryaERP
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-sakaryaerp};Username=${POSTGRES_USER:-sakaryaerp};Password=${POSTGRES_PASSWORD}"
      App__BaseUrl: "${APP_BASE_URL:?APP_BASE_URL gerekli (ör. http://sunucu-ip-adresi) — şifre sıfırlama linki için, Host header'ından güvenlik nedeniyle kurulmaz}"
      # :?required değil (bkz. APP_BASE_URL) — kasıtlı: bu iki değişken sadece web
      # container'ı için anlamlıdır ama compose TÜM dosyayı interpolate ettiğinden, burada
      # da :?required kullanmak günlük "docker compose up -d db" akışını gereksiz yere
      # kırardı. Asıl kilit uygulama tarafında: DbSeeder.SeedFoundationAsync bu değerler
      # boşken Production'da başlamayı zaten reddediyor (canlı olarak doğrulandı).
      Seed__AdminEmail: "${SEED_ADMIN_EMAIL:-}"
      Seed__AdminPassword: "${SEED_ADMIN_PASSWORD:-}"
      Smtp__Host: "${SMTP_HOST:-}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__From: "${SMTP_FROM:-noreply@sakaryaerp.com}"
      Smtp__User: "${SMTP_USER:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
    depends_on:
      db:
        condition: service_healthy

  # Domain + Let's Encrypt eklenene kadar sadece 80 dinler (bkz. appsettings.json
  # EnableHttpsRedirection: false). Domain temin edilince 443 + certbot eklenip
  # web'in EnableHttpsRedirection'ı true yapılacak.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  postgres_data:
