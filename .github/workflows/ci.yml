name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Bağımlılıkları geri yükle
        run: dotnet restore

      - name: Build (0 warning/error hedefi)
        run: dotnet build --no-restore --configuration Release

      - name: Testleri çalıştır
        run: dotnet test --no-build --configuration Release --logger "trx" --results-directory TestSonuclari

      - name: Test sonuçlarını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-sonuclari
          path: TestSonuclari
